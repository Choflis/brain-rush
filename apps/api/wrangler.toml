name = "brain-rush-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Base de datos relacional (ver docs/especificacion/03-arquitectura-tecnica.md, sección 4).
[[d1_databases]]
binding = "DB"
database_name = "brain-rush"
database_id = "43044bf8-eb2f-4e7a-81dd-14e0d5daff24"
migrations_dir = "migrations"

# Almacenamiento de juegos, versiones, PDFs y escaneos.
[[r2_buckets]]
binding = "FILES"
bucket_name = "brain-rush-files"

# Secretos (no versionar): MISTRAL_API_KEY. Usar `wrangler secret put MISTRAL_API_KEY`.
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "*"
