function go(rand){const n=rand?NAME:$("#nm").value.trim();if(!n){$("#nm").classList.add("err");$("#nm").focus();return}NAME=n;shown=0;
S={lives:3,score:0,xp:0,streak:0,ok:0,bad:0,li:0,qi:0,bd:[],mist:[],t0:Date.now(),lf:{f:1,h:1,r:1},used:0,rank:0};
L=NIVELES.map(l=>({...l,qs:rand?sh(l.qs):l.qs}));$("#sc").textContent=0;intro()}
function intro(){const l=L[S.li];S.qi=0;$("#li").textContent=l.icon;$("#ln").textContent=l.name;$("#lx").innerHTML=l.text;$("#lbtn").textContent=l.boss?"¡Entrar a la batalla! ⚔️":"¡Listo para el reto! ⚡";show("sl");say(l.g);hud()}
function lfUpd(){["f","h","r"].forEach(k=>$("#lf-"+k).disabled=!S.lf[k])}
function btn(c,t){const b=document.createElement("button");b.className=c;b.textContent=t;return b}
function ask(){const l=L[S.li],q=l.qs[S.qi],A=$("#ans");Q=q;lock=false;pause=false;A.innerHTML="";$("#fb").hidden=true;$("#hn").hidden=true;show("sq");
$("#qh").textContent=l.icon+" "+l.name.split(":")[0]+" · pregunta "+(S.qi+1)+"/"+l.qs.length;$("#qt").textContent=q.q;
const opts=it=>it.forEach(o=>{const b=btn("opt",o.x);b.dataset.ok=o.ok?1:0;b.onclick=()=>{if(lock)return;b.classList.add("sel");resolve(q.t==="op"?null:o.ok,0)};A.appendChild(b)});
if(q.t==="mc"||q.t==="fill")opts(sh(q.o.map((x,i)=>({x,ok:i===q.a}))));
else if(q.t==="op")opts(q.o.map(x=>({x,ok:1})));
else if(q.t==="tf")opts([{x:"✅ Verdadero",ok:q.a},{x:"❌ Falso",ok:!q.a}]);
else if(q.t==="order"){let pool=sh(q.items),ch=[];const ro=()=>{A.innerHTML='<div class="zone" id="z">'+(ch.length?"":"<i>Toca las tarjetas en orden 👇</i>")+'</div><div id="pl"></div><button class="btn" id="ck">Comprobar ✔️</button>';
ch.forEach((x,i)=>{const b=btn("opt sel",(i+1)+". "+x);b.onclick=()=>{if(lock)return;ch.splice(i,1);pool.push(x);ro()};$("#z").appendChild(b)});
pool.forEach(x=>{const b=btn("opt",x);b.onclick=()=>{if(lock)return;pool.splice(pool.indexOf(x),1);ch.push(x);ro()};$("#pl").appendChild(b)});
$("#ck").disabled=pool.length>0;$("#ck").onclick=()=>{if(!lock)resolve(ch.every((x,i)=>x===q.items[i]),0)}};ro()}
else if(q.t==="match"){const R=sh(q.pairs.map(p=>p[1])),COL=["#27e6ff","#9dff3a","#ffd23f","#ff4d6d"];let sel=null,mp={};
const rm=()=>{A.innerHTML='<div class="mt"><div id="ml"></div><div id="mr"></div></div><button class="btn" id="ck">Comprobar ✔️</button>';
q.pairs.forEach((p,i)=>{const b=btn("opt",p[0]);if(sel===i||mp[i]!=null)b.style.borderColor=COL[i];if(sel===i)b.style.boxShadow="0 0 14px "+COL[i];b.onclick=()=>{if(lock)return;delete mp[i];sel=i;rm()};$("#ml").appendChild(b)});
R.forEach((x,j)=>{const b=btn("opt",x),o=Object.keys(mp).find(k=>mp[k]===j);if(o!=null)b.style.borderColor=COL[o];b.onclick=()=>{if(lock||sel==null)return;Object.keys(mp).forEach(k=>{if(mp[k]===j)delete mp[k]});mp[sel]=j;sel=null;rm()};$("#mr").appendChild(b)});
$("#ck").disabled=Object.keys(mp).length<4;$("#ck").onclick=()=>{if(!lock)resolve(q.pairs.every((p,i)=>R[mp[i]]===p[1]),0)}};rm();A.insertAdjacentHTML("beforebegin","")}
lfUpd();$("#tm").hidden=q.t==="op";if(q.t!=="op")startT();say(q.t==="op"?"Aquí no hay error: ¡opina!":"¡Concentración! 🎯")}
function startT(){tl=25;ls=99;clearInterval(tmr);bar();tmr=setInterval(()=>{if(pause||lock)return;tl-=.1;bar();const c=Math.ceil(tl);if(c!==ls){ls=c;if(c<=5&&c>0)sfx.tick()}if(tl<=0)resolve(false,1)},100)}
function bar(){const b=$("#tb");b.style.width=Math.max(0,tl/25*100)+"%";b.style.background=tl<=7?"var(--r)":"linear-gradient(90deg,var(--g),var(--c))";$("#tn").textContent=Math.ceil(Math.max(tl,0))}
function ansTxt(q){return q.t==="tf"?(q.a?"Verdadero":"Falso"):q.t==="order"?q.items.join(" ➜ "):q.t==="match"?q.pairs.map(p=>p[0]+" = "+p[1]).join("; "):q.o[q.a]}
function resolve(ok,to){if(lock)return;lock=true;clearInterval(tmr);const q=Q;let h;
document.querySelectorAll("#ans .opt").forEach(b=>{if(b.dataset.ok==="1")b.classList.add("good");else if(b.classList.contains("sel")&&["mc","fill","tf"].includes(q.t))b.classList.add("badc");b.disabled=true});
const ck=$("#ck");if(ck)ck.disabled=true;
if(q.t==="op"){S.score+=100;S.xp+=100;h="🧠 "+q.msg+" <b>+100</b>";sfx.ok();confetti(30);say("¡Me encanta cómo piensas!")}
else if(ok){S.streak++;S.ok++;const m=mult(),p=(100+Math.round(Math.max(tl,0)))*m;S.score+=p;S.xp+=p;
h="✅ "+pk(OKS)+(m>1?" 🔥 ¡Racha x"+m+"!":"")+" <b>+"+p+"</b><small>"+q.why+"</small>";sfx.ok();confetti(40);say(pk(OKS));
if(S.streak>=3)give("cer");if(S.streak>=5)give("rac");if(25-tl<6)give("nin")}
else{S.streak=0;S.lives--;S.bad++;S.mist.push(q);
h="💥 "+(to?"¡Se acabó el tiempo!":pk(BADS))+"<small>"+q.why+(["order","match"].includes(q.t)?"<br>Correcto: "+ansTxt(q):"")+"<br>📖 Pista: relee «"+q.src+"».</small>";
sfx.bad();$("#app").classList.add("shake");setTimeout(()=>$("#app").classList.remove("shake"),500);say(S.lives>0?"¡Sin miedo, a la siguiente! 💪":"Nos quedamos sin vidas… 😢")}
const r=rk(S.xp);if(r>S.rank){S.rank=r;sfx.up();confetti(120);h+="<br>⬆️ <b>¡Subiste a "+RK[r][1]+"!</b>"}
hud();$("#fbt").innerHTML=h;$("#fb").hidden=false;$("#nx").onclick=S.lives<=0?()=>finish(false):()=>{S.qi++;S.qi>=L[S.li].qs.length?endLevel():ask()};
$("#fb").scrollIntoView({behavior:"smooth",block:"center"})}
function endLevel(){const l=L[S.li];sfx.up();confetti(110);if(l.boss){give("jef");return finish(true)}
$("#ft").innerHTML="💡 <b>Dato curioso:</b> "+l.fact+"<br><br>"+pk(SORPRESAS);$("#fbtn").onclick=()=>{S.li++;intro()};show("sf");say("¡Vamos por más!")}
function lf(k){if(lock||!S.lf[k])return;const q=Q;
if(k==="f"){if(!["mc","fill"].includes(q.t))return toast("El 50/50 solo sirve con 4 opciones 😉");sh([...document.querySelectorAll("#ans .opt")].filter(b=>b.dataset.ok==="0")).slice(0,2).forEach(b=>b.classList.add("gone"))}
if(k==="h"){$("#hn").hidden=false;$("#hn").textContent="💡 "+(q.hint||"Piensa en lo que acabas de leer.")}
if(k==="r"){pause=true;$("#rd").innerHTML=L[S.li].text;$("#ov").classList.add("on")}
S.lf[k]=0;S.used++;lfUpd()}
function closeRd(){$("#ov").classList.remove("on");pause=false}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function finish(win){clearInterval(tmr);if(win&&S.lives===3)give("sin");if(win&&!S.used)give("det");
const secs=Math.round((Date.now()-S.t0)/1000),r=RK[rk(S.xp)];
$("#card").innerHTML="<div class='big'>"+AV+"</div><h2>"+(win?"🏆 ¡Misión cumplida!":"💫 Misión interrumpida")+"</h2><h3 style='margin:0'>"+esc(NAME)+" · "+r[2]+" "+r[1]+"</h3><div class='st'><div>⭐ Puntaje<br><b style='color:var(--g);font-size:1.5em'>"+S.score+"</b></div><div>⏱️ Tiempo<br><b>"+fmt(secs)+"</b></div><div>✅ Aciertos<br><b>"+S.ok+"</b></div><div>❌ Errores<br><b>"+S.bad+"</b></div></div><div>"+(S.bd.length?S.bd.map(i=>"<span class='bd'>"+INSIGNIAS[i][0]+" "+INSIGNIAS[i][1]+"</span>").join(""):"<small>Aún sin insignias: ¡intenta de nuevo!</small>")+"</div><small>"+TITULO+" · "+new Date().toLocaleDateString("es-PE")+"</small>";
const tp=[...new Set(S.mist.map(q=>q.topic))];$("#wk").innerHTML=tp.length?tp.map(t=>"<span class='bd'>📌 "+t+"</span>").join(""):"🌟 ¡Nada que reforzar! Dominas la lectura.";
$("#er").hidden=true;show("se");if(win){confetti(170);sfx.up();say("¡Salvaste la línea del tiempo!")}else{sfx.bad();say("¡Revisa tus errores y vuelve más fuerte!")}}
function errs(){const e=$("#er");e.hidden=!e.hidden;e.innerHTML="<h2>🔍 Mis errores</h2>"+(S.mist.length?S.mist.map(q=>"<p>❌ <b>"+q.q+"</b><small>✅ "+ansTxt(q)+"<br>"+q.why+"</small></p>").join(""):"<p>🎉 ¡No tuviste errores!</p>")}
</script></body></html>
