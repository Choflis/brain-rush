<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula Conecta · MVP plataforma docente</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2540;--muted:#68728c;--brand:#3b5bdb;--brand2:#e7ecff;--ok:#2f9e44;--warn:#f08c00;--bad:#e03131;--line:#e2e6f0;--r:14px}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:1.5rem;margin:.2rem 0 .3rem}h2{font-size:1.2rem;margin:.2rem 0 .6rem}h3{font-size:1.05rem;margin:.2rem 0 .6rem}h4{margin:1rem 0 .4rem}
.muted{color:var(--muted);font-size:.9rem}
.btn{border:0;background:var(--brand);color:#fff;padding:.55rem .95rem;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--brand2);color:var(--brand)}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.bad{background:#ffe3e3;color:var(--bad)}
.btn.sm{padding:.3rem .65rem;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{outline:2px solid var(--brand);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.grid .card{margin:0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.5rem 0}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical}
label{display:block;font-size:.85rem;color:var(--muted);margin:.5rem 0 .2rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.tw{overflow-x:auto}
.chip{display:inline-block;padding:.12rem .6rem;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--brand2);color:var(--brand)}
.chip.P{background:#d3f9d8;color:#2b8a3e}.chip.T{background:#fff0bf;color:#c26a00}.chip.F{background:#ffd8d8;color:#c92a2a}.chip.J{background:#d0ebff;color:#1971c2}.chip.N{background:#eef0f6;color:#8a93a8}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:.6rem;display:flex;gap:.3rem;flex-wrap:wrap}
.crumbs a{color:var(--brand);cursor:pointer;text-decoration:none}
.tabs{display:flex;gap:.4rem;margin:.8rem 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:.5rem .9rem;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin-bottom:1rem}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}.kpi b{font-size:1.7rem;display:block}.kpi span{color:var(--muted);font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.week{border:1px solid var(--line);border-radius:12px;padding:.7rem;background:#fff}
.week h4{margin:0 0 .4rem;font-size:.95rem}
.sess{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:#fafbff;border-radius:9px;padding:.4rem .6rem;margin-top:.35rem;cursor:pointer;text-align:left}
.sess:disabled{opacity:.55;cursor:not-allowed}
/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#app.t{grid-template-columns:230px 1fr 350px}
#side{background:#fff;border-right:1px solid var(--line);padding:1rem;position:sticky;top:0;height:100vh;overflow:auto}
#main{padding:1.2rem 1.5rem 5rem;min-width:0}
.logo{font-weight:800;font-size:1.15rem;color:var(--brand);margin-bottom:1rem}
.menu button{display:flex;gap:.6rem;align-items:center;width:100%;border:0;background:none;padding:.6rem .7rem;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;text-align:left}
.menu button.on{background:var(--brand2);color:var(--brand)}
.who{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.85rem}
#agent{background:#fff;border-left:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:20}
.ahead{display:flex;gap:.5rem;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.ahead b{flex:1}.ahead select{width:auto;padding:.3rem .5rem}
.actx{font-size:.78rem;color:var(--muted);padding:.4rem .9rem;background:#f7f8fd;border-bottom:1px solid var(--line)}
#chat{flex:1;overflow:auto;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:92%;padding:.55rem .75rem;border-radius:12px;white-space:pre-wrap;font-size:.9rem}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff}.msg.a{align-self:flex-start;background:#eef1fb}
.msg small{display:block;margin-top:.4rem;color:var(--muted)}
.quick{display:flex;gap:.35rem;flex-wrap:wrap;padding:.4rem .9rem}
#cf{display:flex;gap:.4rem;padding:.6rem .9rem;border-top:1px solid var(--line)}
/* login */
.login{max-width:430px;margin:6vh auto;padding:0 1rem}
.login .card{padding:1.4rem}
.err{color:var(--bad);font-size:.88rem;min-height:1.2rem;margin-top:.4rem}
/* heatmap + donut */
.hc{text-align:center;font-weight:700;font-size:.75rem;padding:.3rem .2rem;min-width:30px}
.hc.P{background:#d3f9d8;color:#2b8a3e}.hc.T{background:#fff0bf;color:#c26a00}.hc.F{background:#ffd8d8;color:#c92a2a}.hc.J{background:#d0ebff;color:#1971c2}.hc.N{background:#f1f3f9;color:#b0b7c9}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:auto}
.donut span{background:#fff;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.legend{font-size:.82rem;display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.3rem}
/* modal juego */
#modal{display:none}#modal.on{display:grid;position:fixed;inset:0;background:rgba(20,27,50,.55);place-items:center;z-index:50;padding:1rem}
.mbox{background:#fff;border-radius:18px;padding:1.4rem;width:min(640px,100%);max-height:92vh;overflow:auto}
.gtop{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:.4rem}
.gbar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:1rem}.gbar i{display:block;height:100%;width:100%;background:var(--brand)}
.opts{display:grid;gap:.6rem}
.opt{padding:.9rem;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:1.05rem;text-align:left}
.opt:hover{border-color:var(--brand)}.opt.ok{background:#d3f9d8;border-color:var(--ok)}.opt.no{background:#ffd8d8;border-color:var(--bad)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.mcols .opt{padding:.7rem;font-size:.95rem}.opt.sel{border-color:var(--brand);background:var(--brand2)}.opt.done{background:#d3f9d8;border-color:var(--ok);opacity:.7;cursor:default}
.big{font-size:3rem;font-weight:800;color:var(--brand)}.big small{font-size:1rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(120%);background:#1c2540;color:#fff;padding:.7rem 1.1rem;border-radius:12px;transition:.25s;z-index:60;max-width:90vw}
#toast.on{transform:translateX(-50%)}
@media(max-width:1100px){
 #app.t{grid-template-columns:200px 1fr}
 #agent{position:fixed;right:.5rem;bottom:0;top:auto;width:min(380px,calc(100vw - 1rem));height:72vh;border:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(calc(100% - 50px));transition:.25s}
 #agent.open{transform:none}
}
@media(max-width:760px){
 #app,#app.t{grid-template-columns:1fr}
 #side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
 .menu{display:flex;flex-wrap:wrap;gap:.3rem}.menu button{width:auto}
 #main{padding:1rem 1rem 5rem}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
(()=>{
'use strict';

/* =====================================================================
   MÓDULO 1 · UTILIDADES
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,'.');
const fmt=n=>n==null?'—':(Math.round(n*10)/10).toFixed(1);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toastT);toastT=setTimeout(()=>{t.className=''},2800)}
function csv(name,rows){const t=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* =====================================================================
   MÓDULO 2 · DATOS SIMULADOS (aulas, cursos, alumnos, bimestre)
   ===================================================================== */
const N=16, OPEN_IDX=6;                       // 8 semanas x 2 sesiones; la sesión 7 está "en curso"
const CLASSES=[
 {id:'3A',name:'3.º A',students:['Ana Torres','Luis Mamani','Camila Quispe','Diego Flores','Valeria Ccori','Mateo Huamán','Sofía Apaza','Joaquín Pari']},
 {id:'4B',name:'4.º B',students:['Renzo Cáceres','Luciana Ramos','Bruno Condori','Fernanda Yucra','Gael Choque','Isabella Mendoza','Thiago Valdivia','Mía Cutipa']}
];
const KEYS=[
 {k:'mat',n:'Matemática',topics:['Números hasta 1000','Suma y resta','Multiplicación','División','Fracciones','Medidas de longitud','Figuras geométricas','Gráficos de barras']},
 {k:'com',n:'Comunicación',topics:['Comprensión de cuentos','El sustantivo','El adjetivo','Textos instructivos','La noticia','Ortografía: b y v','Rimas y canciones','Producción de textos']},
 {k:'cyt',n:'Ciencia y Tecnología',topics:['Seres vivos','Las plantas','Los animales','El agua','El suelo','La energía','Materia y estados','Cuidado del ambiente']}
];
const COURSES=[];CLASSES.forEach(c=>KEYS.forEach(k=>COURSES.push({id:c.id+'-'+k.k,cls:c.id,key:k.k,name:k.n,topics:k.topics})));
const STUDENTS=[];CLASSES.forEach(c=>c.students.forEach(n=>STUDENTS.push({sid:slug(n),name:n,cls:c.id})));
const REPO=['Guía docente de Matemática.pdf','Banco de problemas de primaria.docx','Láminas de ciencia y ambiente.pptx','Antología de cuentos regionales.pdf','Rúbricas de evaluación formativa.xlsx'];
const ATT={P:'Presente',T:'Tardanza',F:'Falta',J:'Justificada'};
const ATTC={P:'#2f9e44',T:'#f08c00',F:'#e03131',J:'#339af0'};
const TEACHER={name:'Prof. Rosa Quispe',email:'rosa.quispe',pass:'1234'};
const course=id=>COURSES.find(c=>c.id===id);
const cls=id=>CLASSES.find(c=>c.id===id);
const studentsOf=id=>STUDENTS.filter(s=>s.cls===id);
const sKey=(cid,i)=>cid+':'+i;
const sInfo=(c,i)=>({idx:i,week:Math.floor(i/2)+1,n:i%2+1,topic:c.topics[Math.floor(i/2)]});

/* =====================================================================
   MÓDULO 3 · ESTADO, PERSISTENCIA Y ESTADÍSTICAS
   ===================================================================== */
const KEY='aulaconecta_mvp_v1';
let DB;
function load(){try{const x=localStorage.getItem(KEY);if(x){DB=JSON.parse(x);if(DB&&DB.cfg)return}}catch(e){}DB=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const ST={user:null,route:{name:'home'},tab:'inicio',loginTab:'docente',lang:'es',chat:[],att:{cls:'3A',key:'mat',idx:null},notes:{cls:'3A'},loginErr:''};

function stOf(cid,i){return DB.status[sKey(cid,i)]||(i<OPEN_IDX?'done':i===OPEN_IDX?'open':'locked')}
function getS(cid,i){const k=sKey(cid,i);if(!DB.sess[k])DB.sess[k]=mkSess(course(cid),i,false);return DB.sess[k]}
function attOf(cid,i,sid){const a=DB.att[cid]&&DB.att[cid][i];return a&&a[sid]}
function activeIdx(cid){const a=[];for(let i=0;i<N;i++)if(stOf(cid,i)!=='locked')a.push(i);return a}
function tally(cid,idxs,sids){const c={P:0,T:0,F:0,J:0};idxs.forEach(i=>sids.forEach(s=>{const m=attOf(cid,i,s);if(m)c[m.s]++}));return c}
function pct(c){const d=c.P+c.T+c.F;return d?Math.round((c.P+c.T)/d*100):null}
function attPctS(s){const t={P:0,T:0,F:0,J:0};COURSES.filter(c=>c.cls===s.cls).forEach(c=>{const x=tally(c.id,activeIdx(c.id),[s.sid]);for(const k in t)t[k]+=x[k]});return pct(t)}
function gameAvg(s){const v=[];COURSES.filter(c=>c.cls===s.cls).forEach(c=>{for(let i=0;i<N;i++){const r=DB.res[sKey(c.id,i)];if(r&&r[s.sid])v.push(r[s.sid].score)}});return avg(v)}
function worksAvg(s){const v=[];COURSES.filter(c=>c.cls===s.cls).forEach(c=>{for(let i=0;i<N;i++){const S=DB.sess[sKey(c.id,i)];if(S)S.works.forEach(w=>{if(w.sid===s.sid)v.push(w.score)})}});return avg(v)}
function finalOf(s){const w=DB.cfg.w,a=attPctS(s);const p=[[worksAvg(s),w.t],[gameAvg(s),w.j],[a==null?null:a/5,w.a]].filter(x=>x[0]!=null);const W=p.reduce((x,y)=>x+y[1],0);return W?p.reduce((x,y)=>x+y[0]*y[1],0)/W:null}
function allWorks(clsId){const o=[];COURSES.filter(c=>c.cls===clsId).forEach(c=>{for(let i=0;i<N;i++){const S=DB.sess[sKey(c.id,i)];if(S)S.works.forEach((w,wi)=>o.push({...w,cid:c.id,i,wi,c}))}});return o}
function risks(clsId){const out=[];COURSES.filter(c=>!clsId||c.cls===clsId).forEach(c=>{const act=activeIdx(c.id);studentsOf(c.cls).forEach(s=>{const p=pct(tally(c.id,act,[s.sid]));const m=act.map(i=>attOf(c.id,i,s.sid)).filter(Boolean).map(x=>x.s).slice(-2);const consec=m.length===2&&m.every(x=>x==='F');if((p!=null&&p<DB.cfg.risk)||consec)out.push({s,c,p,consec})})});return out}

function mkSess(c,i,full){
 const inf=sInfo(c,i),r=rng(i*31+c.id.charCodeAt(0)*7+c.id.length),type=i%2?'match':'trivia';
 const S={plan:'',materials:[],works:[],game:{type,area:'Multidisciplinario',n:type==='match'?4:5,published:false,items:[]}};
 S.game.items=buildGame(type,'Multidisciplinario',S.game.n,i*13+c.id.length);
 if(full){
  S.game.published=true;
  S.materials.push({n:'Ficha de trabajo — '+inf.topic+'.pdf',src:'Repositorio institucional'});
  if(i<OPEN_IDX){
   S.materials.push({n:'Presentación — '+inf.topic+'.pptx',src:'Material propio'});
   S.plan=planText(inf.topic,'es');
   S.works=shuf(studentsOf(c.cls),i+7).slice(0,3).map(s=>{const sc=Math.round((11+r()*9)*10)/10;return{sid:s.sid,title:'Tarea: '+inf.topic,score:sc,star:sc>=18}});
  }
 }
 return S;
}
function seed(){
 const r=rng(2026);
 const D={sess:{},att:{},res:{},status:{},cfg:{tol:10,late:30,risk:85,domain:'colegio.edu.pe',w:{t:50,j:30,a:20}}};
 DB=D;
 COURSES.forEach(c=>{
  D.att[c.id]={};
  const sts=studentsOf(c.cls);
  for(let i=0;i<=OPEN_IDX;i++){
   D.att[c.id][i]={};
   D.sess[sKey(c.id,i)]=mkSess(c,i,true);
   sts.forEach((s,si)=>{
    if(i===OPEN_IDX&&si===0)return;           // el primer alumno de cada aula aún no ingresa hoy (demo de asistencia automática)
    const x=r();let st;
    if(si===3)st=x<.5?'P':x<.6?'T':x<.9?'F':'J'; else st=x<.82?'P':x<.9?'T':x<.95?'F':'J';
    D.att[c.id][i][s.sid]={s:st,o:'auto'};
    if(i<OPEN_IDX&&r()<.72){const k=sKey(c.id,i);(D.res[k]=D.res[k]||{})[s.sid]={score:Math.round((9+r()*11)*10)/10,mode:r()<.8?'movil':'computo',tries:1}}
   });
  }
 });
 return D;
}

/* =====================================================================
   MÓDULO 4 · MOTOR DE JUEGOS (trivia + emparejar, puntaje ponderado)
   ===================================================================== */
const AREAS=['Multidisciplinario','Matemática','Comunicación','Ciencia y Tecnología','Personal Social'];
const BANK=[
 {a:'Matemática',q:'¿Cuánto es 7 × 8?',o:['54','56','63','48'],r:1,d:1},
 {a:'Matemática',q:'¿Qué fracción es la mayor?',o:['1/2','1/4','1/8','1/3'],r:0,d:2},
 {a:'Matemática',q:'¿Cuántos lados tiene un cuadrado?',o:['3','4','5','6'],r:1,d:1},
 {a:'Matemática',q:'345 + 278 =',o:['613','623','633','523'],r:1,d:2},
 {a:'Matemática',q:'¿Cuántos metros hay en 2 kilómetros?',o:['200','2 000','20','20 000'],r:1,d:3},
 {a:'Comunicación',q:'¿Cuál de estas palabras es un sustantivo?',o:['correr','mesa','rápido','lejos'],r:1,d:1},
 {a:'Comunicación',q:'¿Cuál está bien escrita?',o:['abión','avión','abion','avíon'],r:1,d:2},
 {a:'Comunicación',q:'En «casa grande», ¿cuál es el adjetivo?',o:['casa','grande','ambas','ninguna'],r:1,d:1},
 {a:'Comunicación',q:'Un texto que explica pasos para hacer algo es…',o:['un cuento','un instructivo','una noticia','una carta'],r:1,d:2},
 {a:'Ciencia y Tecnología',q:'Las plantas necesitan para vivir…',o:['luz, agua y aire','solo tierra','solo aceite','ninguna cosa'],r:0,d:2},
 {a:'Ciencia y Tecnología',q:'El agua en estado sólido se llama…',o:['hielo','vapor','nube','lluvia'],r:0,d:1},
 {a:'Ciencia y Tecnología',q:'¿Qué animal es un mamífero?',o:['tortuga','delfín','rana','pez payaso'],r:1,d:2},
 {a:'Ciencia y Tecnología',q:'¿Cuál es una energía renovable?',o:['petróleo','carbón','solar','gas'],r:2,d:3},
 {a:'Personal Social',q:'¿Cuál es la capital del Perú?',o:['Cusco','Lima','Arequipa','Piura'],r:1,d:1},
 {a:'Personal Social',q:'¿Qué volcán se ve desde Arequipa?',o:['Misti','Huascarán','Ausangate','Salcantay'],r:0,d:2},
 {a:'Personal Social',q:'Reciclar ayuda a…',o:['cuidar el ambiente','ensuciar más','gastar más','nada'],r:0,d:1}
];
const PAIRS={
 'Matemática':[['1/2','Mitad'],['4 lados','Cuadrado'],['3 lados','Triángulo'],['100 cm','1 metro']],
 'Comunicación':[['mesa','Sustantivo'],['rápido','Adjetivo'],['correr','Verbo'],['¿Qué?','Pregunta']],
 'Ciencia y Tecnología':[['Hielo','Sólido'],['Agua','Líquido'],['Vapor','Gas'],['Sol','Energía']],
 'Personal Social':[['Lima','Capital del Perú'],['Misti','Volcán de Arequipa'],['Quechua','Lengua originaria'],['Reciclar','Cuidar el ambiente']]
};
function buildGame(type,area,n,seedN){
 if(type==='match'){const pool=area==='Multidisciplinario'?[].concat(...Object.values(PAIRS)):PAIRS[area];return shuf(pool,seedN).slice(0,Math.min(n,6)).map(p=>({l:p[0],r:p[1]}))}
 const pool=area==='Multidisciplinario'?BANK:BANK.filter(b=>b.a===area);
 return shuf(pool,seedN).slice(0,Math.min(n,pool.length));
}
const TQ=15,TM=60;let G=null;
function startGame(cid,i,opt){
 const g=getS(cid,i).game;
 if(!g||!g.items.length)return toast('Esta sesión aún no tiene juego');
 G={cid,i,g,sid:opt.sid||null,mode:opt.mode||'preview',idx:0,pts:0,right:0,done:false,locked:false,total:g.items.length,tl:g.type==='trivia'?TQ:TM,mt:new Set(),sel:null,err:0,bad:null};
 if(g.type==='match')G.order=shuf(g.items.map((_,k)=>k),Date.now()%1000);
 drawGame();clearInterval(G.timer);G.timer=setInterval(tick,100);
}
function tick(){
 if(!G||G.done)return;G.tl-=.1;
 const bar=$('#gbar');if(bar)bar.style.width=Math.max(0,G.tl/(G.g.type==='trivia'?TQ:TM)*100)+'%';
 if(G.tl<=0){if(G.g.type==='trivia'){if(!G.locked)ans(-1)}else finishGame()}
}
function ans(k){
 if(!G||G.locked||G.done)return;G.locked=true;
 const q=G.g.items[G.idx],ok=k===q.r;
 if(ok){G.right++;G.pts+=q.d*(0.8+0.2*Math.max(0,G.tl)/TQ)}
 document.querySelectorAll('.opt').forEach((b,j)=>{if(j===q.r)b.classList.add('ok');else if(j===k)b.classList.add('no')});
 setTimeout(()=>{if(!G)return;G.idx++;G.locked=false;G.tl=TQ;if(G.idx>=G.total)finishGame();else drawGame()},950);
}
function mpick(side,k){
 if(!G||G.done||G.mt.has(k))return;
 if(!G.sel||G.sel.side===side){G.sel={side,k};drawGame();return}
 if(G.sel.k===k){G.mt.add(k);G.sel=null;if(G.mt.size===G.total){finishGame();return}}
 else{G.err++;G.sel=null;toast('Ups, esa pareja no coincide')}
 drawGame();
}
function finishGame(){
 if(!G||G.done)return;clearInterval(G.timer);
 let sc;
 if(G.g.type==='trivia'){const W=G.g.items.reduce((x,q)=>x+q.d,0);sc=20*G.pts/W}
 else{sc=20*(G.mt.size/G.total)*(0.8+0.2*Math.max(0,G.tl)/TM)-G.err*0.5;G.right=G.mt.size}
 G.sc=Math.round(Math.max(0,Math.min(20,sc))*10)/10;G.done=true;
 if(G.sid&&G.mode!=='preview'){const k=sKey(G.cid,G.i);DB.res[k]=DB.res[k]||{};const p=DB.res[k][G.sid];DB.res[k][G.sid]={score:Math.max(p?p.score:0,G.sc),mode:G.mode,tries:(p?p.tries:0)+1};save()}
 drawGame();render();
}
function closeGame(){if(G)clearInterval(G.timer);G=null;drawGame();render()}
function drawGame(){
 const m=$('#modal');
 if(!G){m.className='';m.innerHTML='';return}
 m.className='on';let b;
 if(G.done){
  b=`<h2>${G.sc>=14?'🎉 ¡Muy bien!':'💪 ¡Sigue practicando!'}</h2><div class="big">${G.sc.toFixed(1)} <small>/ 20</small></div><p>Aciertos: ${G.right} de ${G.total}. ${G.mode==='preview'?'Vista previa: el puntaje no se guarda.':'Puntaje guardado (se conserva el mejor intento).'}</p><button class="btn" data-a="closeGame">Cerrar</button>`;
 }else if(G.g.type==='trivia'){
  const q=G.g.items[G.idx];
  b=`<div class="gtop"><span>Pregunta ${G.idx+1} de ${G.total}</span><span>${esc(q.a)} · ${'★'.repeat(q.d)}</span></div><div class="gbar"><i id="gbar"></i></div><h2>${esc(q.q)}</h2><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-a="ans" data-k="${k}">${esc(o)}</button>`).join('')}</div><p><button class="btn ghost sm" data-a="closeGame">Salir</button></p>`;
 }else{
  b=`<div class="gtop"><span>Une cada pareja · ${G.mt.size}/${G.total}</span><span>Errores: ${G.err}</span></div><div class="gbar"><i id="gbar"></i></div><div class="mcols"><div class="opts">${G.g.items.map((p,k)=>`<button class="opt ${G.mt.has(k)?'done':''} ${G.sel&&G.sel.side==='l'&&G.sel.k===k?'sel':''}" data-a="mpick" data-s="l" data-k="${k}">${esc(p.l)}</button>`).join('')}</div><div class="opts">${G.order.map(k=>`<button class="opt ${G.mt.has(k)?'done':''} ${G.sel&&G.sel.side==='r'&&G.sel.k===k?'sel':''}" data-a="mpick" data-s="r" data-k="${k}">${esc(G.g.items[k].r)}</button>`).join('')}</div></div><p><button class="btn ghost sm" data-a="closeGame">Salir</button></p>`;
 }
 m.innerHTML=`<div class="mbox">${b}</div>`;
}

 return `${t.obj}: que los estudiantes comprendan «${topic}» y lo apliquen en situaciones cotidianas.\n\n${t.in} (10 min)\n• Pregunta motivadora sobre ${topic}.\n• Recojo de saberes previos con lluvia de ideas.\n• Anuncio del propósito y del juego voluntario de cierre.\n\n${t.de} (25 min)\n• Explicación breve con ejemplos del entorno (Arequipa).\n• Práctica guiada en parejas con la ficha de trabajo.\n• Práctica autónoma y retroalimentación individual.\n\n${t.ci} (10 min)\n• Metacognición: ¿qué aprendí? ¿qué me costó?\n• Asignación de la actividad voluntaria (juego de refuerzo).`;

function agentReply(msg){

 const src=cx?[1,AREA_KB[cx.c.key],5]:[1,5];
 if(/plan|sesi|lesson/.test(m))return{t:planText(topic,lang),src,plan:true};
 if(/juego|game|jogo/.test(m))return{t:lang==='en'?`Suggestion: a 5-question trivia mixing areas, or a matching game for «${topic}». Use "Create interactive game" in the Start tab.`:`Sugerencia: una trivia de 5 preguntas multidisciplinarias o un juego de emparejar sobre «${topic}». Usa «Crear juego interactivo» en la pestaña Inicio de la sesión. El puntaje se pondera por dificultad y tiempo.`,src};

 if(/fuente|source|libro|book|fonte/.test(m))return{t:KB.map(x=>`[${x.id}] ${x.t}`).join('\n'),src:[]};
 return{t:t.hi,src:[]};

 csvNotes:()=>{const c=ST.notes.cls;csv(`notas_${c}.csv`,[['Alumno','Trabajos','Juegos','Asistencia %','Nota final'],...studentsOf(c).map(s=>[s.name,fmt(worksAvg(s)),fmt(gameAvg(s)),attPctS(s),fmt(finalOf(s))])])}
};
const ACT_T={      // acciones que modifican datos: SOLO docente (el alumno queda en solo lectura)
 setstatus:el=>{DB.status[sKey(el.dataset.cid,+el.dataset.i)]=el.dataset.s;save();render();toast('Estado de la sesión actualizado')},
 askplan:async()=>{const r=await ask($('#q').value);$('#agent').classList.add('open');const p=$('#plan');if(p&&r&&r.plan)p.value=r.t},
 useplan:el=>{const m=ST.chat[+el.dataset.m],r=ST.route;if(r.name!=='session')return;getS(r.cid,r.i).plan=m.t;save();render();toast('Plan cargado en la sesión')},
 saveplan:el=>{getS(el.dataset.cid,+el.dataset.i).plan=$('#plan').value;save();toast('Plan guardado')},
 genGame:el=>{const S=getS(el.dataset.cid,+el.dataset.i),type=$('#g-type').value,area=$('#g-area').value,n=Math.max(3,Math.min(8,+$('#g-n').value||5));S.game={type,area,n,published:S.game.published,items:buildGame(type,area,n,Date.now()%100000)};save();render();toast('Juego generado')},
 preview:el=>startGame(el.dataset.cid,+el.dataset.i,{mode:'preview'}),
 addfiles:el=>{const f=$('#up').files;if(!f.length)return toast('Elige uno o más archivos');const S=getS(el.dataset.cid,+el.dataset.i);[...f].forEach(x=>S.materials.push({n:x.name,src:'Material propio'}));save();render()},
 addrepo:el=>{getS(el.dataset.cid,+el.dataset.i).materials.push({n:$('#repo').value,src:'Repositorio institucional'});save();render()},
 delmat:el=>{getS(el.dataset.cid,+el.dataset.i).materials.splice(+el.dataset.k,1);save();render()},
 addwork:el=>{const t=$('#w-t').value.trim(),n=parseFloat($('#w-n').value);if(!t||isNaN(n)||n<0||n>20)return toast('Completa título y una nota entre 0 y 20');getS(el.dataset.cid,+el.dataset.i).works.push({sid:$('#w-s').value,title:t,score:n,star:n>=18});save();render()},
 star:el=>{const w=getS(el.dataset.cid,+el.dataset.i).works[+el.dataset.k];w.star=!w.star;save();render()},
 pub:el=>{const g=getS(el.dataset.cid,+el.dataset.i).game;g.published=!g.published;save();render();toast(g.published?'Juego publicado':'Juego despublicado')},
 playlab:el=>startGame(el.dataset.cid,+el.dataset.i,{sid:el.dataset.sid,mode:'computo'}),
 att:el=>{const cid=el.dataset.cid,i=+el.dataset.i,s=el.dataset.s;let n='';if(s==='J'){n=prompt('Motivo de la justificación:')||''}DB.att[cid]=DB.att[cid]||{};DB.att[cid][i]=DB.att[cid][i]||{};DB.att[cid][i][el.dataset.sid]={s,o:'manual',n};save();render()},
 cfgsave:()=>{const c=DB.cfg;c.tol=+$('#c-tol').value||10;c.late=Math.max(c.tol,+$('#c-late').value||30);c.risk=+$('#c-risk').value||85;c.domain=($('#c-dom').value.trim()||c.domain).replace(/^@/,'');c.w={t:+$('#c-wt').value||0,j:+$('#c-wj').value||0,a:+$('#c-wa').value||0};save();render();toast('Configuración guardada')},
 reset:()=>{if(!confirm('¿Restaurar los datos de demostración?'))return;try{localStorage.removeItem(KEY)}catch(e){}DB=seed();save();ST.chat=[];render();toast('Datos de demo restaurados')}
};
const CH={      // cambios en inputs/selects
 lang:el=>{ST.lang=el.value;ST.chat.push({r:'a',t:(L[ST.lang]||L.es).hi,src:[]});renderChat()},
 nfilter:el=>{ST.notes.cls=el.value;render()},
 afilter:el=>{const f=el.dataset.f;ST.att[f]=f==='idx'?+el.value:el.value;if(f!=='idx')ST.att.idx=null;render()},
 score:el=>{if(!isT())return;const v=parseFloat(el.value);if(isNaN(v)||v<0||v>20){toast('Nota entre 0 y 20');return render()}const w=getS(el.dataset.cid,+el.dataset.i).works[+el.dataset.k];w.score=v;save();toast('Nota actualizada')}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
 if(ACT_T[a]){if(!isT())return toast('Vista de solo lectura para alumnos');ACT_T[a](el,e)}else if(ACT[a])ACT[a](el,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;const f=CH[el.dataset.ch];if(f)f(el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!ST.user&&e.target.closest('.login'))doLogin()});

/* =====================================================================
   MÓDULO 9 · INGRESO, VALIDACIÓN DE CORREO Y ASISTENCIA AUTOMÁTICA
   ===================================================================== */
function doLogin(){
 const em=($('#em').value||'').trim().toLowerCase(),dom='@'+DB.cfg.domain;
 const fail=m=>{ST.loginErr=m;const x=document.querySelector('.err');if(x)x.textContent=m};
 if(ST.loginTab==='docente'){
  const pw=$('#pw').value;
  if(!em||!pw)return fail('Ingresa tu correo y contraseña.');
  if(!em.endsWith(dom))return fail('Usa tu correo institucional ('+dom+').');
  if(em!==TEACHER.email+dom||pw!==TEACHER.pass)return fail('Credenciales incorrectas (demo: '+TEACHER.email+dom+' / '+TEACHER.pass+').');
  ST.user={role:'docente',name:TEACHER.name,email:em};
 }else{
  if(!em)return fail('Ingresa tu correo institucional.');
  if(!em.endsWith(dom))return fail('Solo se permite el correo institucional ('+dom+').');
  const s=STUDENTS.find(x=>x.sid+dom===em);
  if(!s)return fail('Ese correo no figura en la matrícula.');
  ST.user={role:'alumno',name:s.name,email:em,sid:s.sid,cls:s.cls};
  const msg=autoAttendance(+$('#sim').value);
  ST.pendingToast=msg;
 }
 ST.loginErr='';ST.route={name:'home'};ST.chat=[];mount();render();
 if(ST.pendingToast){toast(ST.pendingToast);ST.pendingToast=null}
}
function autoAttendance(min){
 const u=ST.user;let st=null;
 COURSES.filter(c=>c.cls===u.cls).forEach(c=>{for(let i=0;i<N;i++)if(stOf(c.id,i)==='open'){
  DB.att[c.id]=DB.att[c.id]||{};DB.att[c.id][i]=DB.att[c.id][i]||{};
  if(!DB.att[c.id][i][u.sid]){st=min<=DB.cfg.tol?'P':min<=DB.cfg.late?'T':'F';DB.att[c.id][i][u.sid]={s:st,o:'auto',m:min}}
 }});
 save();
 return st?`Asistencia registrada automáticamente: ${ATT[st]}`:'Bienvenido/a. Tu asistencia de hoy ya estaba registrada.';
}

load();render();
